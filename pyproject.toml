[project]
name = "ragger-backend"
version = "0.1.0"
description = "RAG Backend API with FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "openai>=1.25.0",
    "cohere>=4.4.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "rank-bm25>=0.2.2",
    "pypdf>=3.15.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "sentence-transformers>=2.2.0",
    "sse-starlette>=3.4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
